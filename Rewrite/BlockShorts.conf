########################################
# 应用名称： YouTube Block Shorts（只屏蔽 Shorts）
# 更新时间： 2026-11-05（v3：v1 已废弃）
# 用途： 只删 YouTube App 导航栏的 Shorts 入口。
#        不碰广告、PiP、后台播放、字幕。
# 适用： Quantumult X
# 注意： 需要开启 MITM 并信任证书；Premium 用户慎用。
# 仓库： https://github.com/kil011/MyProfile
########################################
#
# ⚠️ v1 为什么不行（实测反馈）：
#   1. 我自己写的 BlockShorts.js（自定义 protobuf 解析）在真机 guide
#      上把数据改坏了，导致首页无法下拉刷新。
#   2. conf 里对 reel 接口的 reject-200，会让点开的 Shorts 视频黑屏，
#      而不是优雅地不显示。
#   3. 如果同时开着 YoutubeAds.conf，两个脚本抢同一个 guide 接口，
#      QuanX 只跑其中一个，Shorts 入口就还在。
#   所以 v1 的 JS 和 reel 拦截都已废弃，不要再用。
#
# ✅ v3 正确用法：
#
#  A. 已在用 YoutubeAds.conf（推荐，去广告 + 屏蔽 Shorts 一起）：
#     把 YoutubeAds.conf 里那条 youtubei 脚本的地址，
#     从 Maasea 的原地址换成下面这个 fork 地址，其余规则不动，
#     不要再单独加载本文件里的 guide 规则，也不要开 reel 拦截：
#       https://raw.githubusercontent.com/kil011/MyProfile/master/Rewrite/YoutubeBlockShorts.js
#     这个 fork 就是 Maasea 2026-07-19 版，只改了一处：
#       blockShorts:!1  →  blockShorts:!0
#
#  B. 不用 YoutubeAds，只想屏蔽 Shorts：
#     直接加载本文件（远程重写订阅），或把下面这条规则抄进
#     你自己的 [rewrite_local]，并把 hostname 加进 [mitm]。
#     这条规则用的也是上面那个 Maasea fork，不是 v1 的小脚本。
#
# 两种用法都要：先把 v1 的 BlockShorts.conf / BlockShorts.js
# 全部关掉，彻底杀掉 YouTube App，确认首页能正常下拉、Shorts
# 视频能正常打开（恢复正常），再按上面 A 或 B 加载 v3，
# 再杀掉 YouTube 重开一次，看底部 Shorts 入口还在不在。
#
########################################

hostname = youtubei.googleapis.com, www.youtube.com, s.youtube.com

# ======= 删导航栏 Shorts 入口（仅 B 用法，A 用法不要重复加） ======= #
^https://youtubei\.googleapis\.com/youtubei/v1/guide url script-response-body https://raw.githubusercontent.com/kil011/MyProfile/master/Rewrite/YoutubeBlockShorts.js

# ======= reel 拦截已删除：不要加 ======= #
# 之前 v1 的这两条会导致 Shorts 黑屏，已删：
# ^https://youtubei.googleapis.com/youtubei/v1/reel/reel_watch_sequence url reject-200
# ^https://youtubei.googleapis.com/youtubei/v1/reel/reel_item_watch url reject-200
