########################################
# 应用名称： YouTube Block Shorts（只屏蔽 Shorts）
# 脚本作者： Muse for kil011（独立小脚本，非 Maasea 复制）
# 更新时间： 2026-11-05
# 用途： 只删 YouTube App 导航栏的 Shorts 入口，并拦截 Shorts 播放流请求。
#        不碰广告、PiP、后台播放、字幕；可与 YoutubeAds.conf 叠加使用。
# 适用： Quantumult X（也可用在 Surge / Loon，见下方注释）
# 注意： 需要开启 MITM 并信任证书；Premium 用户慎用。
# 仓库： https://github.com/kil011/MyProfile
# JS：   Rewrite/BlockShorts.js（同仓库）
########################################

# QuanX 引用方式：把下面这行放到配置文件的 [rewrite_local]，
# 并把 hostname 加到 [mitm]。JS 用 raw 链接：
#   https://raw.githubusercontent.com/kil011/MyProfile/master/Rewrite/BlockShorts.js

hostname = youtubei.googleapis.com, www.youtube.com, s.youtube.com

# ======= 1. 删导航栏 Shorts 入口 ======= #
# 只处理 guide 接口，JS 里会递归删掉 browseId=FEshorts 的入口，
# JSON 和 protobuf 两种返回都处理，解析失败时原样放行。
^https://youtubei\.googleapis\.com/youtubei/v1/guide url script-response-body https://raw.githubusercontent.com/kil011/MyProfile/master/Rewrite/BlockShorts.js

# ======= 2. 拦截 Shorts 播放流（防从搜索/推荐点进 Shorts） ======= #
^https://youtubei\.googleapis\.com/youtubei/v1/reel/reel_watch_sequence url reject-200
^https://youtubei\.googleapis\.com/youtubei/v1/reel/reel_item_watch url reject-200

# ======= 3. 网页端 Shorts 直链（可选，不影响 App 主流程） ======= #
# ^https://www\.youtube\.com/shorts/ url reject-200
