# 原始作者： @DivineEngine, @app2smile, @Maasea, @VirgilClyne
# 原始文件： https://raw.githubusercontent.com/ddgksf2013/Rewrite/master/AdBlock/YoutubeAds.conf
# 原始更新： 2025-03-09
# 本文件改动（2026-11-05，kil011/MyProfile）：
#   只改了一处：youtubei 脚本地址从 Maasea 原版
#     https://raw.githubusercontent.com/Maasea/sgmodule/refs/heads/master/Script/Youtube/youtube.response.js
#   换成同仓库的 fork
#     https://raw.githubusercontent.com/kil011/MyProfile/master/Rewrite/YoutubeBlockShorts.js
#   那个 fork 是 Maasea 2026-07-19 版，只改了一处默认值：
#     blockShorts:!1  →  blockShorts:!0
#   其余规则、hostname 全部照抄原版，一字未改。
#
# 用途： 去广告 + 视频自动 PiP、后台播放、自动翻译，
#        同时删掉导航栏 Shorts 入口（FEshorts）。
# 不适用： 允许 UDP 转发的节点、Premium。
# 如果视频广告仍然存在，请在 QuantumultX 配置文件 [general] 下添加 udp_drop_list=443
# 通知频道： https://t.me/ddgksf2021
# 原始仓库： https://github.com/DivineEngine
# 原始仓库： https://github.com/Maasea
# 原始仓库： https://github.com/app2smile
########################################
#
# 用法：用这个文件替换你原来加载的 ddgksf YoutubeAds.conf，
# 不要两个一起开。两个文件都对 youtubei/v1/guide 用了
# script-response-body，QuanX 同一个请求只会跑其中一个脚本，
# 一起开就会互相抢，Shorts 入口可能还在。
# 加载后彻底杀掉 YouTube App 再重开。
#

hostname = -redirector*.googlevideo.com,*.googlevideo.com,www.youtube.com,s.youtube.com,youtubei.googleapis.com

# ======= 视频广告请求 ======= #
(^https?:\/\/[\w-]+\.googlevideo\.com\/(?!dclk_video_ads).+?)&ctier=L(&.+?),ctier,(.+) url 302 $1$2$3
^https?:\/\/[\w-]+\.googlevideo\.com\/(?!(dclk_video_ads|videoplayback\?)).+&oad url reject-200


# ======= 视频PIP|后台播放|瀑布流|搜索页|播放页|短视频|贴片广告  ======= #
^https?:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/(browse|next|player|search|reel\/reel_watch_sequence|guide|account\/get_setting|get_watch) url script-response-body https://raw.githubusercontent.com/kil011/MyProfile/master/Rewrite/YoutubeBlockShorts.js


# ======= 通用广告请求 ======= #
^https?:\/\/(www|s)\.youtube\.com\/api\/stats\/ads url reject-200
^https?:\/\/(www|s)\.youtube\.com\/(pagead|ptracking) url reject-200
^https?:\/\/s\.youtube\.com\/api\/stats\/qoe\?adcontext url reject-200
